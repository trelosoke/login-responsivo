<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Responsivo</title>
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main>
        <section class="login-image">
        </section>
        <section class="login-form">
            <h1>Login</h1>
            <p>Seja bem-vindo(a) novamente. Faça log-in para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
            <form method="post">
                <div class="login-field">
                    <span class="material-symbols-outlined">person</span>
                    <input type="email" name="login" id="ilogin">
                    <label for="ilogin">Login</label>
                </div>
                <div class="login-field">
                    <span class="material-symbols-outlined">key</span>
                    <input type="password" name="passwrd" id="ipasswrd">
                    <label for="ipasswrd">Senha</label>
                </div>
                <input type="submit" value="Enviar">
                <a href="#">
                    Esqueci a senha
                </a>
            </form>
        </section>
    </main>
</body>
</html>
